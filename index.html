<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ilyas Madouni — Network & Security Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Newsreader:opsz,wght@6..72,400;6..72,500&display=swap" rel="stylesheet">
<style>
:root{--paper:#E8EDEE;--ink:#11232C;--mute:#4B606A;--line:#9FB1B8;--sig:#1948E0;--amber:#B86E00;--card:#F5F8F8;
--d:'Bricolage Grotesque','Segoe UI',system-ui,sans-serif;--b:'Newsreader',Georgia,'Times New Roman',serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--paper:#0F1B22;--ink:#E4EDEF;--mute:#9DB0B8;--line:#35505B;--sig:#7C9DFF;--amber:#F0B429;--card:#15262F}}
:root[data-theme="dark"]{--paper:#0F1B22;--ink:#E4EDEF;--mute:#9DB0B8;--line:#35505B;--sig:#7C9DFF;--amber:#F0B429;--card:#15262F}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font:400 1.06rem/1.58 var(--b)}
main{max-width:1240px;margin:0 auto;padding:clamp(16px,3vw,40px);display:grid;gap:clamp(20px,3vw,48px);grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);align-items:start}
h1,h2,h3{font-family:var(--d);margin:0;letter-spacing:-.02em;line-height:1.02}
h1{font-size:clamp(2.7rem,6.4vw,5rem);font-weight:800}
h2{font-size:clamp(1.9rem,3.6vw,2.7rem);font-weight:700}
h3{font-size:1.15rem;font-weight:700;letter-spacing:-.01em;line-height:1.2}
p{margin:0}
.muted{color:var(--mute)}
#panel{position:sticky;top:clamp(16px,3vw,40px);display:grid;gap:18px;min-width:0}
#panel:focus-visible,#panel h1:focus-visible,#panel h2:focus-visible{outline:2px solid var(--sig);outline-offset:6px}
.role{font:500 1.15rem/1.3 var(--d);color:var(--sig)}
.status{display:inline-flex;gap:10px;align-items:center;font:500 .95rem var(--d);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:6px 14px;width:fit-content}
.status i{width:9px;height:9px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 var(--amber);animation:pulse 2s infinite}
@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}
.back{font:500 .95rem var(--d);background:none;border:0;color:var(--sig);cursor:pointer;padding:4px 0;width:fit-content;text-decoration:underline;text-underline-offset:4px}
.item{border-left:3px solid var(--line);padding:2px 0 2px 16px;display:grid;gap:6px}
.item.on{border-color:var(--sig)}
.item ul{margin:0;padding-left:1.1em}
.item li{margin:2px 0}
.when{font:500 .92rem var(--d);color:var(--mute)}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font:500 .82rem var(--d);border:1px solid var(--line);border-radius:6px;padding:1px 8px;background:var(--card)}
.stack{display:grid;gap:18px}
.grp{display:grid;gap:6px}
dl{display:grid;grid-template-columns:auto 1fr;gap:6px 18px;margin:0}
dt{font:500 .95rem var(--d);color:var(--mute)}dd{margin:0}
.links{display:grid;gap:10px}
.links a{display:flex;justify-content:space-between;gap:12px;font:600 1.05rem var(--d);color:var(--ink);text-decoration:none;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 16px;transition:border-color .15s,transform .15s}
.links a:hover{border-color:var(--sig);transform:translateX(4px)}
.links a span{color:var(--mute);font-weight:500;overflow-wrap:anywhere;text-align:right}
a:focus-visible,button:focus-visible{outline:2px solid var(--sig);outline-offset:3px}
.map{display:grid;gap:14px;min-width:0}
.board{background:radial-gradient(var(--line) 1px,transparent 1.4px) 0 0/24px 24px,var(--card);border:1px solid var(--line);border-radius:18px;overflow:hidden}
svg{display:block;width:100%;height:auto}
.edge{stroke:var(--line);stroke-width:2;fill:none;stroke-dasharray:3 7;transition:stroke .3s}
.edge.seen{stroke:var(--sig);stroke-dasharray:none}
.edge.x{opacity:.45}
.node{cursor:pointer;outline:none}
.node .sh{fill:var(--card);stroke:var(--ink);stroke-width:2.5;transition:fill .2s}
.node.seen .sh{fill:var(--sig);stroke:var(--sig)}
.node .ring{fill:none;stroke:var(--sig);stroke-width:2;opacity:0;transform-box:fill-box;transform-origin:center;transition:opacity .2s,transform .2s;transform:scale(.8)}
.node:hover .ring,.node:focus-visible .ring,.node.cur .ring{opacity:1;transform:scale(1)}
.node text{font:700 22px var(--d);fill:var(--ink);text-anchor:middle;pointer-events:none}
.pkt{fill:var(--amber)}
.hub text{font-size:24px}
#chips{display:flex;flex-wrap:wrap;gap:8px}
#chips button{font:600 .95rem var(--d);color:var(--ink);background:var(--card);border:1px solid var(--line);border-radius:99px;padding:8px 16px;cursor:pointer;transition:background .15s,color .15s}
#chips button:hover{border-color:var(--sig)}
#chips button.seen{border-color:var(--sig)}
#chips button.cur{background:var(--sig);color:var(--paper);border-color:var(--sig)}
#meter{font:500 .95rem var(--d);color:var(--mute)}
@media (max-width:880px){
 main{grid-template-columns:1fr}
 .map{order:-1}
 #panel{position:static}
 h1{font-size:clamp(2.4rem,12vw,3.4rem)}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
<section id="panel" tabindex="-1" aria-live="polite"></section>
<section class="map" aria-label="Interactive network map">
<div class="board"><svg id="net" viewBox="0 0 800 600" role="group" aria-label="Network map: select a node to open a section"></svg></div>
<nav id="chips" aria-label="Sections"></nav>
<p id="meter"></p>
</section>
</main>
<script>
const $=s=>document.querySelector(s);
const tags=a=>'<div class="tags">'+a.map(t=>'<span>'+t+'</span>').join('')+'</div>';
const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;

const S={
start:{html:()=>`
 <h1>Ilyas Madouni</h1>
 <p class="role">Network &amp; security engineering student</p>
 <p>I like finding out how systems get broken so I can build ones that don't. My work sits between firewalls, VPNs, intrusion detection and the cloud services they now protect.</p>
 <p class="muted">This map is how I'd describe my work: each node is one part of it. Click one to inspect it, or follow the glowing packets.</p>
 <span class="status"><i></i>Open to internships in network security</span>`},
exp:{label:'Experience',shape:'hex',x:170,y:150,cap:'Two internships securing real networks.',html:()=>`
 <div class="item on"><h3>IT Security &amp; Cloud Intern</h3><span class="when">Groupe Barid Al-Maghrib, Rabat · Jul–Sep 2026</span>
 <p>Securing a hybrid on-premise and cloud infrastructure toward ISO/IEC 27001.</p>
 <ul><li>Segmented traffic and built a high-availability setup on a FortiGate 1100E.</li><li>Centralised remote-access authentication with FreeRADIUS.</li><li>Linked on-premise to Azure with WireGuard, including network diagnostics.</li><li>Set up cloud monitoring with Azure Monitor and applied least-privilege access through Entra ID.</li><li>Centralised and analysed security logs with ELK (Filebeat) and contributed to the ISO/IEC 27001 compliance initiative.</li></ul>
 ${tags(['FortiGate','HA Cluster','FreeRADIUS','WireGuard','Azure','Azure Monitor','Entra ID','ELK','ISO 27001'])}</div>
 <div class="item"><h3>Network &amp; Security Intern</h3><span class="when">SNRT Maroc, Rabat · Jul–Sep 2025</span>
 <ul><li>Compared pfSense, Sophos and Fortinet and justified the chosen architecture.</li><li>Built OpenVPN, captive portal, DHCP and CARP high availability on VMware, then ran security validation tests.</li><li>Analysed SRT for HD/4K streams with AES-256 and FFmpeg for CAN 2025 video: under 150 ms latency, 0% packet loss, stable Full HD.</li></ul>
 ${tags(['pfSense','VMware','OpenVPN','DHCP','CARP','SRT','FFmpeg','AES-256'])}</div>`},
proj:{label:'Projects',shape:'sq',x:640,y:120,cap:'Things I built to attack, detect and analyse.',html:()=>`
 <div class="item on"><h3>NIDS Stack</h3><span class="when">2026</span><p>Suricata with 65,000+ rules watching traffic passively. Catches port scans, SQL injection, brute force and C2 beaconing on a live Kibana dashboard (ELK).</p>${tags(['Suricata','Elasticsearch','Kibana','Filebeat','IDS/IPS','Ubuntu','Threat Detection'])}</div>
 <div class="item"><h3>CloudPenLab</h3><span class="when">2026 · AWS</span><p>Six EC2 machines (DVWA, WebGoat, vsftpd, Flask API, Windows AD) attacked with Python and boto3. GuardDuty detected 100% of 12 vulnerabilities, 5 of them critical (CVSS above 9); Security Hub scored 87/100 against CIS.</p>${tags(['AWS EC2/VPC','GuardDuty','Security Hub','boto3','Kali Linux','Red Team'])}</div>
 <div class="item"><h3>VulnScanner</h3><span class="when">Jan 2026</span><p>Finds 11 CVEs in under 3 minutes, with a live dashboard and HTML, PDF and JSON reports. Flask API in Docker.</p>${tags(['Python','Flask','Docker','CVE','Nmap','SQLite','WebSockets'])}</div>
 <div class="item"><h3>Network Sniffer</h3><span class="when">Feb–Mar 2026</span><p>Eight capture modes with detection for DDoS, SYN floods and port scans, plus JSON and CSV reports with in-depth TCP/IP protocol analysis.</p>${tags(['Python','Scapy','Packet Analysis','Threat Detection'])}</div>
 <div class="item"><h3>AirChat</h3><span class="when">2025</span><p>Serverless LAN chat over UDP multicast, with RSA/AES encryption and verified file transfer.</p>${tags(['Python','Flask','UDP','RSA/AES','JavaScript'])}</div>`},
skills:{label:'Skills',shape:'ring',x:690,y:380,cap:'The tools I reach for.',html:()=>`
 <div class="stack">
 <div class="grp"><h3>Networking &amp; security</h3>${tags(['TCP/IP', 'UDP', 'IPv4', 'OSI', 'VLAN', 'DNS', 'DHCP', 'VPN', 'OpenVPN', 'WireGuard', 'CARP', 'SRT', 'AES-256', 'RSA', 'IDS/IPS', 'Suricata', 'Nmap', 'pfSense', 'Fortinet'])}</div>
 <div class="grp"><h3>Cloud &amp; DevOps</h3>${tags(['AWS EC2', 'AWS VPC', 'AWS S3', 'GuardDuty', 'Security Hub', 'Azure VM', 'Azure VNet', 'Azure Monitor', 'Entra ID', 'Docker', 'Git'])}</div>
 <div class="grp"><h3>Languages &amp; systems</h3>${tags(['Python', 'Shell', 'Bash', 'PowerShell', 'C', 'C++', 'SQL', 'HTML', 'CSS', 'Linux', 'Ubuntu', 'Windows'])}</div>
 <div class="grp"><h3>Monitoring &amp; labs</h3>${tags(['VMware', 'VirtualBox', 'Cisco Packet Tracer', 'Elasticsearch', 'Kibana', 'Filebeat', 'Power BI'])}</div></div>`},
edu:{label:'Education',shape:'dia',x:140,y:430,cap:'Studies and certifications.',html:()=>`
 <div class="item on"><h3>Engineering degree, Cybersecurity &amp; IT Infrastructures</h3><span class="when">EMSI Rabat · 2026–now</span></div>
 <div class="item"><h3>Engineering degree, Intelligent Communicating &amp; Mobile Systems</h3><span class="when">FST Fès · 2024–2025</span></div>
 <div class="item"><h3>Preparatory classes, TSI track</h3><span class="when">CPGE Settat · 2022–2024</span></div>
 <div class="item"><h3>Technical baccalaureate</h3><span class="when">Errachidia · 2021–2022</span></div>
 <h3>Certifications</h3>
 <div class="stack"><p>Fortinet Certified Associate in Cybersecurity, FortiGate Operator <span class="muted">· Apr 2026</span></p><p>ISC2 Certified in Cybersecurity <span class="muted">· 2026</span></p><p>Cisco PCEP, Python programmer <span class="muted">· 2024</span></p><p>DELF B2, French <span class="muted">· 2022</span></p></div>`},
contact:{label:'Contact',shape:'gate',x:430,y:535,cap:'Send me a packet.',html:()=>`
 <p>I'm looking for an internship in network security. If you have a role or a project worth discussing, write to me.</p>
 <div class="links">
 <a href="CV_Ilyas_Madouni.pdf" download>Resume <span>Download PDF</span></a>
 <a href="mailto:madouni2004@gmail.com">Email <span>madouni2004@gmail.com</span></a>
 <a href="tel:+212675278467">Phone <span>+212 675 278 467</span></a>
 <a href="https://linkedin.com/in/ilyas-madouni" target="_blank" rel="noopener">LinkedIn <span>/in/ilyas-madouni</span></a>
 <a href="https://github.com/napsterlab" target="_blank" rel="noopener">GitHub <span>napsterlab</span></a></div>
 <dl><dt>Based in</dt><dd>Rabat, Morocco</dd><dt>Languages</dt><dd>Arabic (native), French (B2), English (fluent)</dd></dl>`}
};
const order=['exp','proj','skills','edu','contact'];
const hub={x:400,y:300};
const seen=new Set();let cur='start';

const NS='http://www.w3.org/2000/svg';
function shape(t,x,y){
 const e=(n,a)=>{const o=document.createElementNS(NS,n);for(const k in a)o.setAttribute(k,a[k]);return o};
 const g=document.createElementNS(NS,'g');
 let p;
 if(t==='hex')p=e('polygon',{points:[0,1,2,3,4,5].map(i=>{const a=Math.PI/3*i;return(x+34*Math.cos(a)).toFixed(1)+','+(y+34*Math.sin(a)).toFixed(1)}).join(' ')});
 else if(t==='sq')p=e('rect',{x:x-29,y:y-29,width:58,height:58,rx:6});
 else if(t==='dia')p=e('polygon',{points:`${x},${y-38} ${x+38},${y} ${x},${y+38} ${x-38},${y}`});
 else if(t==='gate')p=e('rect',{x:x-42,y:y-24,width:84,height:48,rx:24});
 else if(t==='hub')p=e('circle',{cx:x,cy:y,r:46});
 else p=e('circle',{cx:x,cy:y,r:32});
 p.setAttribute('class','sh');
 const r=e('circle',{cx:x,cy:y,r:t==='hub'?60:52,class:'ring'});
 g.append(r,p);
 if(t==='ring'){g.append(e('circle',{cx:x,cy:y,r:16,fill:'none',stroke:'currentColor','stroke-width':2,opacity:.35}))}
 return g;
}
const svg=$('#net');
const edges={};
function addEdge(a,b,cls,id){
 const l=document.createElementNS(NS,'path');
 l.setAttribute('d',`M${a.x} ${a.y}L${b.x} ${b.y}`);l.setAttribute('class','edge '+cls);
 svg.append(l);if(id)edges[id]=l;return l;
}
[['exp','edu'],['proj','skills'],['skills','contact'],['exp','proj']].forEach(([a,b])=>addEdge(S[a],S[b],'x'));
order.forEach(id=>addEdge(hub,S[id],'',id));
const nodes={};
function addNode(id,n,isHub){
 const g=document.createElementNS(NS,'g');
 g.setAttribute('class','node'+(isHub?' hub':''));g.setAttribute('tabindex','0');g.setAttribute('role','button');
 g.setAttribute('aria-label',isHub?'Back to start':'Open '+n.label);
 g.append(shape(isHub?'hub':n.shape,n.x,n.y));
 const t=document.createElementNS(NS,'text');t.setAttribute('x',n.x);t.setAttribute('y',n.y+(isHub?78:n.shape==='gate'?56:62));
 t.textContent=n.label;g.append(t);
 g.addEventListener('click',()=>go(id));
 g.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go(id)}});
 svg.append(g);nodes[id]=g;
}
addNode('start',{x:hub.x,y:hub.y,label:'Ilyas'},true);
order.forEach(id=>addNode(id,S[id]));
if(!reduce){
 order.forEach((id,i)=>{
  const c=document.createElementNS(NS,'circle');c.setAttribute('r',5);c.setAttribute('class','pkt');
  const m=document.createElementNS(NS,'animateMotion');
  const out=i%2===0;
  m.setAttribute('path',out?`M${hub.x} ${hub.y}L${S[id].x} ${S[id].y}`:`M${S[id].x} ${S[id].y}L${hub.x} ${hub.y}`);
  m.setAttribute('dur',(3+i*.7)+'s');m.setAttribute('repeatCount','indefinite');m.setAttribute('begin',(i*.6)+'s');
  c.append(m);svg.insertBefore(c,svg.querySelector('.node'));
 });
}
const chips=$('#chips');
order.forEach(id=>{const b=document.createElement('button');b.textContent=S[id].label;b.dataset.id=id;b.onclick=()=>go(id);chips.append(b)});

function go(id,fromInit){
 cur=id;if(id!=='start')seen.add(id);
 const p=$('#panel');
 const head=id==='start'?'':`<button class="back" onclick="go('start')">Back to start</button><h2 tabindex="-1">${S[id].label}</h2><p class="muted">${S[id].cap}</p>`;
 p.innerHTML=head+S[id].html();
 for(const k in nodes){nodes[k].classList.toggle('cur',k===id);nodes[k].classList.toggle('seen',seen.has(k))}
 for(const k in edges)edges[k].classList.toggle('seen',seen.has(k));
 chips.querySelectorAll('button').forEach(b=>{b.classList.toggle('cur',b.dataset.id===id);b.classList.toggle('seen',seen.has(b.dataset.id))});
 const n=seen.size;
 $('#meter').textContent=n===order.length?'You inspected every node. Contact is the exit.':n+' of '+order.length+' nodes inspected';
 if(fromInit)return;
 const h=p.querySelector('h2,h1');if(h)h.focus({preventScroll:true});
 if(innerWidth<=880)p.scrollIntoView({behavior:reduce?'auto':'smooth',block:'start'});
}
go('start',true);
</script>
</body>
</html>
